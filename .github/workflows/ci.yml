name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint || true

  cli-commands:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test --help
        run: |
          node bin/vbot.js --help

      - name: Test info command
        run: |
          node bin/vbot.js info

      - name: Test config list
        run: |
          node bin/vbot.js config list

      - name: Test status
        run: |
          node bin/vbot.js status --json

      - name: Test plugin list
        run: |
          node bin/vbot.js plugin list

  scaffold-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test vbot init
        run: |
          cd /tmp
          node ${{ github.workspace }}/bin/vbot.js init test-project
          test -f /tmp/test-project/package.json
          test -f /tmp/test-project/src/index.js
          echo "Scaffold test passed"
